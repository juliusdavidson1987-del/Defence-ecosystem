name: Ingest approved suggestion

# When you review a "Suggest an organisation" issue and add the `approved` label,
# this drafts the node (dedupe-checked, tagged, AI-enriched if a key is set) and
# posts it back on the issue with ready-to-run SQL. It never inserts — you run the
# SQL (or use the drafter's insert), keeping a human on the accuracy gate.

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  ingest:
    # only for the approval label on an actual org suggestion
    if: >
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'new-organisation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Draft node from the issue
        id: draft
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          DATA_FILE: data.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional — enables AI enrichment
        run: node scripts/ingest-issue.mjs > comment.md

      - name: Post the draft on the issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            const status = `${{ steps.draft.outputs.status }}`;
            const label = { new: 'drafted', duplicate: 'duplicate', unverified: 'needs-verify' }[status];
            if (label) {
              try { await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: [label] }); } catch (e) {}
            }
