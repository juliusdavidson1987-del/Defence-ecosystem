name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data.json
        run: node scripts/validate-data.mjs data.json

      - name: Validate HTML
        run: node scripts/validate.mjs index.html

      - name: Check links
        run: node scripts/check-links.mjs data.json
